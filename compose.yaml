services:
  db:
    image: postgres
    restart: always
    ports: 
      - 2345:5432
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: johndoe
      POSTGRES_DB: mydb
    volumes:
      - database_data:/var/lib/postgresql/data
      # Ajoutez un script d'initialisation
     

  adminer:
    image: adminer
    ports:
      - 8080:8080
    depends_on:
      - db

volumes:
  database_data: