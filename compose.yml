  
services:
  db:
    image: postgres
    restart: always
    ports: 
      - 5432:5432
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: randompassword
      POSTGRES_USER: johndoe
      POSTGRES_DB: mydb
    volumes:
      - database_data:/var/lib/postgresql/data
     

volumes:
  database_data: